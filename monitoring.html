<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISAM — TV Monitoring</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4FD8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1B4FD8;--primary-dark:#1338B0;--primary-light:#EEF3FF;
  --bg:#F0F4FF;--surface:#FFFFFF;
  --border:#D4DCEF;--text:#0F1A3C;--muted:#5A6A8A;
  --sidebar-w:240px;--topbar-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding-left:var(--sidebar-w);display:flex;flex-direction:column;height:100vh;}

/* ── SIDEBAR (desain dipertahankan dari versi sebelumnya) ── */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,var(--primary-dark) 0%,var(--primary) 100%);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.sidebar-brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar-logo{display:flex;align-items:center;gap:10px}
.sidebar-logo-icon{width:42px;height:42px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.slt-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:.3px}
.slt-sub{font-size:9px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.8px;margin-top:1px}
.sidebar-user{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-user-inner{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.08);border-radius:10px}
.su-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.su-name{font-size:13px;font-weight:600;color:#fff}
.su-role{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.snav-section{padding:10px 16px 4px;font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1.2px}
.snav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);transition:all .15s;text-decoration:none;position:relative;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.snav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.snav-item.active{background:rgba(255,255,255,.16);color:#fff}
.snav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#fff;border-radius:0 3px 3px 0}
.snav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-safe{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px}
.sf-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.sf-val{font-size:11px;font-weight:600;color:#4ADE80}

/* ── TOPBAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);height:var(--topbar-h);display:flex;align-items:center;padding:0 24px;flex:none;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.topbar-title-block{flex:1}
.topbar-title{font-size:18px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:12px}
.live-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#16A34A;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clock-pill{font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:#fbfcff;}

/* ── IFRAME AREA ── */
.frame-wrap{flex:1;min-height:0;position:relative;background:#0b1642;}
.frame-wrap iframe{width:100%;height:100%;border:none;display:block;}
.frame-loading{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0b1642;transition:opacity .3s;
}
.frame-loading.hidden{opacity:0;pointer-events:none;}
.fl-spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:#f39c2b;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.fl-text{font-size:13px;color:rgba(255,255,255,.6);font-weight:500}

@media(max-width:767px){
  body{padding-left:0}
  .sidebar{display:none}
}
</style>
</head>
<body>

<!--
  ARSITEKTUR FILE INI (baca sebelum edit):
  Ini SENGAJA dibuat sebagai "shell" tipis, bukan tempat menaruh kode dashboard.
  Konten Monitoring (inspeksi) dan Commissioning ditampilkan lewat <iframe> yang
  menunjuk LANGSUNG ke dashboard.html dan comissioning.html - BUKAN disalin/di-
  hardcode ke sini. Alasannya: supaya file ini TIDAK PERNAH basi lagi. Kalau
  dashboard.html atau comissioning.html diperbaiki/ditambah fitur di masa depan,
  perubahan itu OTOMATIS muncul di sini juga, tanpa perlu ada yang mengedit atau
  menyalin ulang kode ke file ini.

  Kalau butuh ubah TAMPILAN shell (sidebar/topbar/warna), edit di sini.
  Kalau butuh ubah ISI dashboard (data, tabel, kartu statistik, dst), edit di
  dashboard.html atau comissioning.html langsung - JANGAN ditambahkan ke sini.
-->

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🛡️</div>
      <div>
        <div class="slt-name">ISAM</div>
        <div class="slt-sub">Inspection System Asset Mgmt</div>
      </div>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-inner">
      <div class="su-avatar">V</div>
      <div>
        <div class="su-name">Viewer</div>
        <div class="su-role">Viewer (Read Only)</div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="snav-section">Menu Utama</div>
    <a href="index.html" class="snav-item"><span class="snav-icon">🏠</span>Dashboard</a>
    <button class="snav-item active" id="navMonitoring" onclick="switchView('monitoring')"><span class="snav-icon">📊</span>Monitoring</button>
    <button class="snav-item" id="navCommissioning" onclick="switchView('commissioning')"><span class="snav-icon">📦</span>Commissioning</button>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-safe">
      <div class="sf-label">🔐 Hak Akses Sistem</div>
      <div class="sf-val">Viewer (Read Only) 🔒</div>
    </div>
  </div>
</aside>

<header class="topbar">
  <div class="topbar-title-block">
    <div class="topbar-title" id="topbarTitle">Dashboard Monitoring</div>
    <div class="topbar-sub" id="topbarSub">Live overview performa inspeksi &amp; status asset seluruh area.</div>
  </div>
  <div class="topbar-right">
    <div class="clock-pill" id="clockPill">--:--</div>
    <div class="live-pill"><span class="live-dot"></span>Live</div>
  </div>
</header>

<div class="frame-wrap">
  <div class="frame-loading" id="frameLoading">
    <div class="fl-spinner"></div>
    <div class="fl-text">Memuat tampilan...</div>
  </div>
  <iframe id="mainFrame" src="dashboard.html" title="ISAM Monitoring" onload="onFrameLoad()"></iframe>
</div>

<script>
const VIEWS = {
  monitoring: {
    src: 'dashboard.html',
    title: 'Dashboard Monitoring',
    sub: 'Live overview performa inspeksi & status asset seluruh area.'
  },
  commissioning: {
    // ?readonly=1 -> comissioning.html otomatis sembunyikan semua tombol edit/
    // tambah/hapus, ganti badge user jadi "Viewer", dan auto-refresh sendiri
    // tiap 5 menit (dirancang khusus buat kebutuhan tampilan TV kayak ini).
    src: 'comissioning.html?readonly=1',
    title: 'Commissioning Monitoring',
    sub: 'Live overview status komisioning unit seluruh site (Read Only).'
  }
};

function switchView(key){
  const view = VIEWS[key];
  if(!view) return;
  document.getElementById('frameLoading').classList.remove('hidden');
  document.getElementById('mainFrame').src = view.src;
  document.getElementById('topbarTitle').innerText = view.title;
  document.getElementById('topbarSub').innerText = view.sub;
  document.getElementById('navMonitoring').classList.toggle('active', key==='monitoring');
  document.getElementById('navCommissioning').classList.toggle('active', key==='commissioning');
}

function onFrameLoad(){
  document.getElementById('frameLoading').classList.add('hidden');
}

function updateClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clockPill').innerText = hh + ':' + mm + ' WIB';
}
updateClock();
setInterval(updateClock, 30000);

/* Ganti-gantian otomatis antara Monitoring <-> Commissioning tiap 10 menit -
   cocok buat TV yang nggak ada orang mencet apa-apa, biar dua-duanya kelihatan
   bergantian sepanjang hari. HAPUS blok ini kalau maunya diam di 1 tampilan saja
   (biarkan orang pilih manual lewat sidebar). */
let __autoCycle = 'monitoring';
setInterval(()=>{
  __autoCycle = __autoCycle==='monitoring' ? 'commissioning' : 'monitoring';
  switchView(__autoCycle);
}, 10*60*1000);
</script>

</body>
</html>
